<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gasket release proof</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="styles.css">
<script>
// Apply the saved theme before first paint. Storage can be unavailable, so every access is guarded.
(function () { try { var t = localStorage.getItem('gasket-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {} })();
</script>
</head>
<body>
<header class="top">
  <button class="iconbtn" id="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">&#9776;</button>
  <img class="logo" src="logo.png" alt="Gasket logo">
  <div class="brandblock">
    <span class="brand">Gaske<b>t</b></span>
    <span class="tag">Release proof &mdash; evidence locked to the artifact</span>
  </div>
  <span class="sp"></span>
  <span class="pill env">synthetic credit-scoring demo</span>
  <span class="pill" id="snap-time" hidden></span>
  <a class="pill link" id="gitlab-link" href="#" target="_blank" rel="noopener">Open project in GitLab <span aria-hidden="true">&#8599;</span></a>
  <button class="iconbtn" id="theme-toggle" type="button" aria-label="Switch between light and dark theme" title="Switch theme">&#9680;</button>
</header>
<div class="shell">
  <aside id="side"></aside>
  <main id="app">
    <p class="muted">Loading release data&hellip;</p>
    <noscript><p>This dashboard needs JavaScript. Every run also has a static evidence page under <code>runs/</code>.</p></noscript>
  </main>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
