<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gasket release proof</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="styles.css">
<script>
// Apply the saved theme before first paint. Storage can be unavailable, so every access is guarded.
(function () { try { var t = localStorage.getItem('gasket-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {} })();
</script>
</head>
<body>
<a class="skip" href="#app">Skip to content</a>
<header class="top">
  <button class="iconbtn" id="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">Menu</button>
  <img class="logo" src="logo.png" alt="">
  <span class="brand">Gasket</span>
  <span class="crumb" id="crumb"><b>credit-scoring-model</b> / main</span>
  <span class="sp"></span>
  <details class="snap" id="snap"></details>
  <button class="iconbtn" id="theme-toggle" type="button" aria-label="Switch between light and dark theme" title="Switch theme">Theme</button>
</header>
<div class="shell">
  <aside id="side" aria-label="Sections"></aside>
  <main id="app" tabindex="-1">
    <p class="muted">Loading release data</p>
    <noscript><p>This dashboard needs JavaScript. Every run also has a static evidence page under <code>runs/</code>.</p></noscript>
  </main>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
